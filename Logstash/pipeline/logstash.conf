input {
  beats {
    port => 5044
  }
}

filter {

  if [event_type] != "alert" {
      drop { }
  }

  mutate {
    rename => { "src_ip" => "[source][ip]" }
    rename => { "dest_ip" => "[destination][ip]" }
  }

  if [source][ip] and [source][ip] =~ /^\d+\.\d+\.\d+\.\d+$/ and [source][ip] !~ /^(10\.|192\.168\.|172\.(1[6-9]|2[0-9]|3[01])\.)/ {

    throttle {
      before_count => -1
      after_count => 1
      period => 60
      max_age => 3600
      key => "%{[source][ip]}"
      add_tag => ["vt_src_lookup"]
    }

    if "vt_src_lookup" in [tags] {
      http {
        url => "https://www.virustotal.com/api/v3/ip_addresses/%{[source][ip]}"
        verb => "GET"
        headers => {
          "x-apikey" => "VT API key"
        }
        target_body => "virustotal_source"
        socket_timeout => 10
        connect_timeout => 10
        request_timeout => 10
      }
    }

    http {
      url => "https://otx.alienvault.com/api/v1/indicators/IPv4/%{[source][ip]}/general"
      verb => "GET"
      headers => {
        "X-OTX-API-KEY" => "OTX API key"
      }
      target_body => "otx_source"
      socket_timeout => 10
      connect_timeout => 10
      request_timeout => 10
    }

  }

  if [destination][ip] and [destination][ip] =~ /^\d+\.\d+\.\d+\.\d+$/ and [destination][ip] !~ /^(10\.|192\.168\.|172\.(1[6-9]|2[0-9]|3[01])\.)/ {

    throttle {
      before_count => -1
      after_count => 1
      period => 60
      max_age => 3600
      key => "%{[destination][ip]}"
      add_tag => ["vt_dest_lookup"]
    }

    if "vt_dest_lookup" in [tags] {
      http {
        url => "https://www.virustotal.com/api/v3/ip_addresses/%{[destination][ip]}"
        verb => "GET"
        headers => {
          "x-apikey" => "VT API key"
        }
        target_body => "virustotal_destination"
        socket_timeout => 10
        connect_timeout => 10
        request_timeout => 10
      }
    }

    http {
      url => "https://otx.alienvault.com/api/v1/indicators/IPv4/%{[destination][ip]}/general"
      verb => "GET"
      headers => {
        "X-OTX-API-KEY" => "OTX API key"
      }
      target_body => "otx_destination"
      socket_timeout => 10
      connect_timeout => 10
      request_timeout => 10
    }

  }

  ruby {
    code => '
      begin
        vt = event.get("virustotal_source")
        if vt && vt["data"] && vt["data"]["attributes"]
          attrs = vt["data"]["attributes"]
          stats = attrs["last_analysis_stats"]
          if stats
            event.set("vt_src_malicious",  stats["malicious"].to_i)
            event.set("vt_src_suspicious", stats["suspicious"].to_i)
            event.set("vt_src_harmless",   stats["harmless"].to_i)
          end
          event.set("vt_src_country",    attrs["country"])         if attrs["country"]
          event.set("vt_src_as_owner",   attrs["as_owner"])        if attrs["as_owner"]
          event.set("vt_src_reputation", attrs["reputation"].to_i) if attrs["reputation"]
        end
        event.remove("virustotal_source")
      rescue => e
        event.set("vt_src_error", e.message)
      end

      begin
        vt = event.get("virustotal_destination")
        if vt && vt["data"] && vt["data"]["attributes"]
          attrs = vt["data"]["attributes"]
          stats = attrs["last_analysis_stats"]
          if stats
            event.set("vt_dest_malicious",  stats["malicious"].to_i)
            event.set("vt_dest_suspicious", stats["suspicious"].to_i)
            event.set("vt_dest_harmless",   stats["harmless"].to_i)
          end
          event.set("vt_dest_country",    attrs["country"])         if attrs["country"]
          event.set("vt_dest_as_owner",   attrs["as_owner"])        if attrs["as_owner"]
          event.set("vt_dest_reputation", attrs["reputation"].to_i) if attrs["reputation"]
        end
        event.remove("virustotal_destination")
      rescue => e
        event.set("vt_dest_error", e.message)
      end

      begin
        otx = event.get("otx_source")
        if otx
          event.set("otx_src_pulse_count", otx["pulse_info"]["count"].to_i) if otx["pulse_info"]
          event.set("otx_src_country",     otx["country_name"])              if otx["country_name"]
          event.set("otx_src_asn",         otx["asn"])                       if otx["asn"]
        end
        event.remove("otx_source")
      rescue => e
        event.set("otx_src_error", e.message)
      end

      begin
        otx = event.get("otx_destination")
        if otx
          event.set("otx_dest_pulse_count", otx["pulse_info"]["count"].to_i) if otx["pulse_info"]
          event.set("otx_dest_country",     otx["country_name"])              if otx["country_name"]
          event.set("otx_dest_asn",         otx["asn"])                       if otx["asn"]
        end
        event.remove("otx_destination")
      rescue => e
        event.set("otx_dest_error", e.message)
      end

      malicious = (event.get("vt_src_malicious")    || 0).to_i +
                  (event.get("vt_dest_malicious")   || 0).to_i
      pulses    = (event.get("otx_src_pulse_count")  || 0).to_i +
                  (event.get("otx_dest_pulse_count") || 0).to_i

      if malicious >= 5 || pulses >= 3
        event.set("threat_level", "HIGH")
      elsif malicious >= 1 || pulses >= 1
        event.set("threat_level", "MEDIUM")
      else
        event.set("threat_level", "LOW")
      end
    '
  }

  if [source][ip] or [destination][ip] {
    fingerprint {
      source => ["[source][ip]", "[destination][ip]"]
      target => "event_hash"
      method => "SHA256"
    }
  }

  mutate {
    remove_tag => ["vt_src_lookup", "vt_dest_lookup", "beats_input_raw_event"]
  }

}

output {
  stdout {
    codec => rubydebug
  }
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    user => "${ELASTIC_USERNAME}"
    password => "${ELASTIC_PASSWORD}"
    index => "suricata-alerts-%{+YYYY.MM.dd}"
  }
}